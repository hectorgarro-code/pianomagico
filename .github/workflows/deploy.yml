name: Deploy Valle to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valle-production
  cancel-in-progress: false

jobs:
  web-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHP_BINARY: php
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci
      - name: Test game and deployment
        run: |
          php --version
          node --test $(find src/game src/modules/core scripts -name '*.test.js' -type f)
          for file in $(find backend -name '*.php' -type f); do php -l "$file" || exit 1; done
      - name: Build
        run: npm run build
      - name: Deploy runtime over verified FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TLS_SERVERNAME: ${{ vars.FTP_TLS_SERVERNAME || 'hstgr.io' }}
        run: node scripts/deployGitHub.mjs
      - name: Preserve runtime rollback files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-backup-${{ github.run_id }}
          path: scratch/github-deploy-backup/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
